es:
  flow_kanban:
    default_stages:
      new: Nuevo
      in_progress: En curso
      won: Ganado
      lost: Perdido
    card_fields:
      label: Campos de la tarjeta del Kanban
      hint: Lo que el tablero muestra en cada tarjeta sin abrirla. El título siempre se muestra.
      contact: Contacto
      value: Valor
      conversations: Conversaciones y canales
      assignee: Responsable
      time_in_stage: Tiempo en la etapa
      last_activity: Última actividad
    features:
      label: Funciones del Kanban
      hint: Lo que esta cuenta puede usar. Un administrador aún configura cada una por tablero.
      auto_create:
        label: Negociaciones automáticas
        hint: Una conversación nueva puede abrir una negociación sola, en los tableros y bandejas que elija un administrador.
      stale_alerts:
        label: Alerta de negociación detenida
        hint: Una negociación que se queda demasiado en una etapa se marca y se avisa a su agente, en las etapas con límite.
    settings:
      unsupported_currency: Moneda no admitida.
      quote_template_too_long: El mensaje de presupuesto puede tener hasta 2000 caracteres.
    task_reminder:
      due_soon: 'Tarea vence en %{minutes} min: %{title} (%{card})'
      overdue: 'Tarea vencida: %{title} (%{card})'
      open: Abrir el tablero
  activerecord:
    errors:
      models:
        custom/kanban/card:
          attributes:
            value_cents:
              follows_items: sigue la suma de los productos; quite los productos para escribir un valor
        custom/kanban/stage_automation:
          attributes:
            trigger_config:
              no_reply: necesita un número de horas de 1 a 720 y quién está en silencio, el cliente o el equipo
            actions:
              empty: necesita al menos una acción
              too_many: puede tener como máximo %{count} acciones
              step_stage: 'acción %{position}: elige una etapa de este tablero'
              step_title: 'acción %{position}: ponle a la tarea un título de hasta 255 caracteres'
              step_task_type: 'acción %{position}: elige el tipo de tarea'
              step_due: 'acción %{position}: el plazo va de 0 a 720 horas'
              step_agent: 'acción %{position}: elige un agente de esta cuenta'
              step_label: 'acción %{position}: elige una etiqueta de esta cuenta'
              step_type: 'acción %{position}: acción desconocida'
        custom/kanban/board:
          attributes:
            auto_create:
              daily_cap: el límite diario debe estar entre 1 y 500
              inboxes: incluye una bandeja de fuera de esta cuenta
              no_inbox: necesita al menos una bandeja de entrada
        custom/kanban/stage:
          attributes:
            stale_after_days:
              open_only: solo vale para etapas abiertas
