en:
  flow_kanban:
    default_stages:
      new: New
      in_progress: In progress
      won: Won
      lost: Lost
    card_fields:
      label: Kanban card fields
      hint: What the board shows on each card without opening it. The title always shows.
      contact: Contact
      value: Value
      conversations: Conversations and channels
      assignee: Assignee
      time_in_stage: Time in stage
      last_activity: Last activity
    features:
      label: Kanban features
      hint: Behaviours this account may use. An administrator still sets each one up per board.
      auto_create:
        label: Automatic deals
        hint: A new conversation can open a deal on its own, on the boards and inboxes an administrator picks.
      stale_alerts:
        label: Stalled-deal alerts
        hint: A deal that stays too long in a stage is flagged and its agent is told, on the stages given a limit.
    settings:
      unsupported_currency: Currency not supported.
      quote_template_too_long: The quote message can have up to 2000 characters.
    task_reminder:
      due_soon: 'Task due in %{minutes} min: %{title} (%{card})'
      overdue: 'Task overdue: %{title} (%{card})'
      open: Open the board
  activerecord:
    errors:
      models:
        custom/kanban/card:
          attributes:
            value_cents:
              follows_items: follows the sum of the products; remove the products to type a value
        custom/kanban/board:
          attributes:
            auto_create:
              daily_cap: daily limit must be between 1 and 500
              inboxes: includes an inbox outside this account
              no_inbox: needs at least one inbox to watch
        custom/kanban/stage:
          attributes:
            stale_after_days:
              open_only: only applies to open stages
